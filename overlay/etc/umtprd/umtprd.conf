#
# uMTP Responder config — RG35XXH
#

loop_on_disconnect 1

# USB IDs (same as Linux Foundation gadget for compatibility)
usb_vendor_id   0x1d6b
usb_product_id  0x0100
manufacturer    "Anbernic"
product         "RG35XXH"
serial          "rg35xxh-001"
# uMTP numeric values are hexadecimal; 0x200 is 512 bytes for high-speed USB.
usb_max_packet_size 200
usb_functionfs_mode 1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"

# Storages — folder share
storage / "RG35XXH Root" rw

# Optional second storage (uncomment to share SD card root)
# storage /home/hataketsu "Home" rw
